<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="mode-split">

  <!-- ===================================================================
       ANDROID AUTO / CARPLAY DYNAMIC GRID STAGE
       =================================================================== -->
  <div id="stage" class="stage">

    <!-- HERO CARD: LIVING MAP & ATMOSPHERE (Tap to expand/restore) -->
    <section id="card-map" class="card card-map" onclick="toggleMapFocus(event)">
      <div id="sat-tiles"></div>
      <canvas id="light-canvas"></canvas>
      <div id="night-tiles"></div>
      <div id="sun-sheen"></div>
      <canvas id="sky-canvas"></canvas>
      <div class="map-vignette"></div>

      <!-- You are here pulse marker -->
      <div id="you-marker"><div class="dot"></div><div class="label" id="marker-label">Locating...</div></div>
      <div class="map-badge" id="map-badge">
        <span class="badge-dot"></span>
        <span id="map-badge-text">100-MILE LIVE SATELLITE</span>
      </div>

      <!-- Floating Map Clock & Subtitle (Bottom-Left) -->
      <div class="map-hud-overlay">
        <div class="clock" data-clock><span class="hm">--:--</span><span class="ampm"></span></div>
        <div class="subline" data-date-line>&nbsp;</div>
      </div>

      <!-- Expand / Restore Floating Indicator Pill -->
      <button class="expand-pill" id="map-expand-btn" aria-label="Toggle full screen map" onclick="toggleMapFocus(event)">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <svg class="icon-collapse hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
        <span id="expand-pill-label">Full Map</span>
      </button>
    </section>

    <!-- RIGHT CONTEXT STACK: ADAPTIVE WIDGET CARDS -->
    <aside id="context-stack" class="context-stack">

      <!-- CONSOLIDATED WEATHER WIDGET -->
      <section id="card-weather" class="card card-weather" onclick="event.stopPropagation()">
        <div class="wc-top">
          <div class="wc-icon" id="wc-icon"></div>
          <div>
            <div class="wc-temp" id="wc-temp">--&deg;</div>
            <div class="wc-cond" id="wc-cond">Loading...</div>
          </div>
        </div>
        <div class="wc-meta" id="wc-meta">&nbsp;</div>
        <div class="wc-hours" id="wc-hours"></div>
      </section>

      <!-- SPOTIFY CONNECT CARD (Auto-collapses when not playing) -->
      <section id="card-spotify" class="card card-spotify hidden" onclick="event.stopPropagation()">
        <div class="sp-header">
          <span class="sp-tag"><i class="pulse-dot"></i> SPOTIFY CONNECT</span>
          <span class="sp-device" id="sp-device-label">Surface Go 2</span>
        </div>
        
        <div class="sp-body">
          <img id="hp-cover" class="sp-art" alt="Album Cover">
          <div class="sp-details">
            <div class="sp-title" id="hp-title">--</div>
            <div class="sp-artist" id="hp-artist">--</div>
          </div>
        </div>

        <div class="sp-scrubber">
          <div class="sp-bar"><div id="hp-bar" class="sp-bar-fill"></div></div>
          <div class="sp-time-row">
            <span id="sp-time-elapsed">0:00</span>
            <span id="sp-time-total">0:00</span>
          </div>
        </div>

        <div class="sp-controls" data-controls>
          <button class="tbtn small" data-action="previous" aria-label="Previous Track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="tbtn primary" data-action="toggle" aria-label="Play or pause" data-playicon>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>
          </button>
          <button class="tbtn small" data-action="next" aria-label="Next Track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </section>

    </aside>

  </div>

  <!-- ===================================================================
       BOTTOM DOCK (Android Auto / CarPlay Style Navigation Bar)
       =================================================================== -->
  <nav class="aa-dock" id="aa-dock" onclick="event.stopPropagation()">
    <div class="dock-left">
      <button class="dock-pill active" id="dock-btn-auto" onclick="setDashboardMode('split')" title="Dashboard View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="8" rx="2"/><rect x="14" y="15" width="7" height="6" rx="2"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="dock-pill" id="dock-btn-map" onclick="setDashboardMode('map')" title="Fullscreen Map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span>Live Map</span>
      </button>
    </div>

    <!-- Center Dock Music Pill (Shows track title & mini controls when playing) -->
    <div class="dock-center-player hidden" id="dock-center-player" onclick="toggleMapFocus(event)">
      <img id="dock-thumb" class="dock-art" alt="Track Art">
      <div class="dock-track-info">
        <span class="dock-title" id="dock-title">--</span>
        <span class="dock-artist" id="dock-artist">--</span>
      </div>
      <button class="tbtn tiny" data-action="toggle" aria-label="Play/Pause" data-playicon onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>
      </button>
    </div>

    <div class="dock-right">
      <div class="dock-clock" data-dock-clock>--:-- PM</div>
      <button class="dock-icon-btn" onclick="enterScreensaver()" title="Photo Screensaver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
    </div>
  </nav>

  <!-- ===================================================================
       SCREENSAVER — Default Photo Frame (Returns after inactivity)
       =================================================================== -->
  <div id="screensaver">
    <img class="photo" id="photo-a" alt="" crossorigin="anonymous">
    <img class="photo" id="photo-b" alt="" crossorigin="anonymous">
    <div class="ss-scrim" id="ss-scrim"></div>

    <div class="ss-hud">
      <div class="ss-clock-col tone-light" id="ss-clock-col">
        <div class="clock" data-clock><span class="hm">--:--</span><span class="ampm"></span></div>
        <div class="subline" id="ss-weather-line">&nbsp;</div>
      </div>

      <!-- Borderless Spotify Hero on Screensaver (Only while active) -->
      <div class="ss-spotify tone-light hidden" id="ss-spotify">
        <div class="ss-sp-head">
          <span class="live"><i></i>SPOTIFY CONNECT</span>
          <button class="pill-btn" id="backdrop-btn" data-action="backdrop">Backdrop: Photo</button>
        </div>
        <div class="ss-sp-track">
          <img id="ss-cover" alt="" crossorigin="anonymous">
          <div style="min-width:0;flex:1">
            <div class="title" id="ss-title">--</div>
            <div class="artist muted" id="ss-artist">--</div>
          </div>
        </div>
        <div class="ss-progress">
          <div class="track"><div class="fill" id="ss-fill"></div></div>
          <div class="times muted"><span id="ss-elapsed">0:00</span><span id="ss-duration">0:00</span></div>
        </div>
        <div class="ss-controls" data-controls>
          <button class="tbtn" data-action="previous" aria-label="Previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button class="tbtn" data-action="back15" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 3.5v4.5h4.5"/><text x="12.6" y="15.6" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg></button>
          <button class="tbtn primary" data-action="toggle" aria-label="Play or pause" data-playicon><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg></button>
          <button class="tbtn" data-action="fwd15" aria-label="Forward 15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M21 3.5v4.5h-4.5"/><text x="11.4" y="15.6" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg></button>
          <button class="tbtn" data-action="next" aria-label="Next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Bottom minimalist gesture swipe bar -->
    <div class="gesture-bar" id="gesture-bar"></div>
  </div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/livemap.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/media.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
